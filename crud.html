<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #e9d8d7;
            margin: 20px;
            max-width: 800px;
            padding: 20px;
        }
        h2 {
            color: black
        }
        div{
            margin-bottom: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        input, button {
            margin: 5px;
            padding: 5px;
        }
        table {
            background-color: white;
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }   
        .edit-btn {
         background-color: #d5618e;  
        color: white;
        }
        .delete-btn {
        background-color: #d5618e; 
         color: white;
        }
        tr:hover {
        background-color: #f0f0f0;
        }
        button:hover {
        opacity: 0.8;
        cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>친구 추가 / 수정</h2>
    <div>
        <input type="text" id="name" placeholder="이름">
        <input type="text" id="relation" placeholder="관계">
        <input type="text" id="phone" placeholder="전화번호">
        <input type="email" id="email" placeholder="이메일">
        <input type="date" id="birthday">
        <button onclick="addFriend()">추가</button>
    </div>

    <hr>
    <h2>친구 목록</h2>
    <table border="1">
        <thead>
            <tr>
                <th>이름</th><th>관계</th><th>전화번호</th><th>이메일</th><th>생일</th><th>수정</th><th>삭제</th>
            </tr>
        </thead>
        <tbody id="friendList">
        </tbody>
    </table>
    <script>
        let friends = [
    {
        name: "홍길동",
        관계: "친구",
        전화번호: "010-1234-5678",
        이메일: "example@email.com",
        생일: "1990-01-01"
    },
    {
        name: "김길동",
        관계: "가족",
        전화번호: "010-2345-6789",
        이메일: "kim@email.com",
        생일: "1992-02-02"
    },
    {
        name: "박길동",
        관계: "친구",
        전화번호: "010-3456-7890",
        이메일: "park@email.com",
        생일: "1994-03-03"
    },
    {
        name: "이길동",
        관계: "친구",
        전화번호: "010-4567-8901",
        이메일: "lee@email.com",
        생일: "1996-04-04"
    },
    {
        name: "최길동",
        관계: "가족",
        전화번호: "010-5678-9012",
        이메일: "choi@email.com",
        생일: "1998-05-05"
    }
    ];
        let editingIndex = -1;//수정 중,추가 하는 중
        function addFriend(){
        const name = document.querySelector("#name").value;
        const relation = document.querySelector("#relation").value;
        const phone = document.querySelector("#phone").value;
        const email = document.querySelector("#email").value;
        const birthday = document.querySelector("#birthday").value;
        if(!name || !relation || !phone || !email || !birthday){
            alert("모든 필드를 입력해주세요.");
            return;
        }
        if(!name){
            alert("이름을 입력해주세요.");
            return;
        }
        if(name.length < 2){
            alert("이름은 최소 2글자 이상이어야 합니다."); 
            return;
        }
        if(!relation){
            alert("관계를 입력해주세요.");
            return;
        }
        if(!phone){
            alert("전화번호를 입력해주세요.");
            return;
        }
        if(phone.length < 9){
            alert("전화번호는 최소 9자리 이상이어야 합니다.");
            return;
        }
        if(!email){
            alert("이메일을 입력해주세요.");
            return;
        }
        if(!email.includes("@")){
            alert("이메일 형식이 올바르지 않습니다.");
            return;
        }
        if(!birthday){
            alert("생일을 입력해주세요.");
            return;
        }   

        const newFriend = {
            name: name,
            관계: relation,
            전화번호: phone,
            이메일: email,
            생일: birthday
        };
        if (editingIndex === -1) {
            friends.push(newFriend);
        } else {
          friends[editingIndex] = newFriend;
          editingIndex = -1;
        }
        document.querySelector("#name").value = "";
        document.querySelector("#relation").value = "";
        document.querySelector("#phone").value = "";
        document.querySelector("#email").value = "";
        document.querySelector("#birthday").value = "";
        displayFriends();
        }
        function editFriend(index){
        editingIndex = index;
        const friend = friends[index];
        document.querySelector("#name").value = friend.name;
        document.querySelector("#relation").value = friend.관계;
        document.querySelector("#phone").value = friend.전화번호;
        document.querySelector("#email").value = friend.이메일;
        document.querySelector("#birthday").value = friend.생일;
    }
    function deleteFriend(index){
        if(confirm("정말 삭제하시겠습니까?")){
            friends.splice(index, 1);
            displayFriends();
        }
    }
    function displayFriends(){
        const list = document.querySelector("#friendList");
        let html = "";
      friends.forEach((friend, index) => {
        html += `
        <tr>
            <td>${friend.name}</td>
            <td>${friend.관계}</td>
            <td>${friend.전화번호}</td>
            <td>${friend.이메일}</td>
            <td>${friend.생일}</td>
            <td><button class="edit-btn" onclick="editFriend(${index})">수정</button></td>
            <td><button class="delete-btn" onclick="deleteFriend(${index})">삭제</button></td>
        </tr>   
    `;
});
    list.innerHTML = html;
    }
    displayFriends();
    </script>
</body>
</html>
